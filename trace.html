<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<title>かきじゅん・なぞりがき</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="trace.css">
</head>
<body>
<main id="traceApp">
  <header class="trace-header">
    <a href="index.html" class="back-link">← れんしゅうにもどる</a>
    <h1>かきじゅん・なぞりがき</h1>
  </header>

  <section class="trace-pick">
    <label for="gradeSelect" class="pick-label">がくねん</label>
    <select id="gradeSelect" class="grade-select" aria-label="学年を選択"></select>
    <div id="kanjiList" class="trace-kanji-list" role="list"></div>
  </section>

  <section class="trace-main" id="traceMain">
    <div class="trace-head">
      <div id="bigKanji" class="trace-big" aria-hidden="true"></div>
      <div class="trace-info">
        <div id="infoReading" class="info-reading"></div>
        <div id="infoWords" class="info-words"></div>
        <div id="infoStrokes" class="info-strokes"></div>
      </div>
    </div>

    <div class="writer-wrap">
      <div class="writer-guide" aria-hidden="true"></div>
      <div id="writer" class="writer"></div>
    </div>
    <p id="traceMsg" class="trace-msg" aria-live="polite">「みてみよう」で書き順を見てから、なぞってみよう。</p>

    <div class="trace-buttons">
      <button type="button" id="watchBtn" class="primary">▶ みてみよう</button>
      <button type="button" id="traceBtn" class="secondary">✎ なぞってみよう</button>
      <button type="button" id="freeBtn" class="secondary">✍ みないで かいてみよう</button>
    </div>
    <div class="trace-nav">
      <button type="button" id="prevBtn" class="ghost">← まえの かんじ</button>
      <button type="button" id="nextBtn" class="ghost">つぎの かんじ →</button>
    </div>

    <h2 class="strip-title">かきじゅん</h2>
    <div id="strip" class="stroke-strip"></div>
  </section>

  <section class="offline-box">
    <h2>オフラインで使うには</h2>
    <p>ネットにつながっているうちに、書き順データをこの端末に保存しておくと、教室のネットが不安定でも使えます。（全1,026字・数MB〜10MBほど）</p>
    <button type="button" id="saveAllBtn" class="secondary">書き順データをぜんぶ保存する</button>
    <p id="saveMsg" class="save-msg" aria-live="polite"></p>
  </section>

  <p class="credit">書き順データ：<a href="https://github.com/k1LoW/hanzi-writer-data-jp" target="_blank" rel="noopener">@k1low/hanzi-writer-data-jp</a>（chanind版のフォーク）（Arphic Public License / LGPL）、表示：<a href="https://hanziwriter.org/" target="_blank" rel="noopener">Hanzi Writer</a>（MIT）。インターネットにつながっているときに使えます。</p>
</main>
<script src="data-grade1.js"></script>
<script src="data-grade2.js"></script>
<script src="data-grade3.js"></script>
<script src="data-grade4.js"></script>
<script src="data-grade5.js"></script>
<script src="data-grade6.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<script src="trace.js"></script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
