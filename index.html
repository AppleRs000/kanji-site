<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d">
<title>かんじ れんしゅう</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- 設定画面 -->
  <section id="setup">
    <h1>かんじ れんしゅう</h1>
    <a class="primary print-link" href="print.html">漢字プリントを作る</a>
    <a class="secondary print-link stroke-feature" href="trace.html">かきじゅん・なぞりがき</a>
    <a class="secondary print-link" href="weak.html">にがて漢字・マスター率</a>

    <h2>1. がくねん</h2>
    <div id="gradeButtons" class="choice-grid cols-3"></div>

    <div id="rangeBlock" hidden>
      <h2>2. はんい</h2>
      <div id="rangeButtons" class="choice-grid cols-1"></div>
    </div>

    <h2>3. もんだい</h2>
    <div id="typeButtons" class="choice-grid cols-3">
      <button type="button" class="choice" data-type="read">よみ</button>
      <button type="button" class="choice" data-type="write">かき</button>
      <button type="button" class="choice" data-type="mix">りょうほう</button>
    </div>

    <h2>4. かず</h2>
    <div id="countButtons" class="choice-grid cols-3">
      <button type="button" class="choice" data-count="5">5もん</button>
      <button type="button" class="choice" data-count="10">10もん</button>
      <button type="button" class="choice" data-count="20">20もん</button>
    </div>

    <label class="check-option stroke-option stroke-feature"><input type="checkbox" id="autoStroke"> 答えたあとに、書き順を見る（ネットが必要）</label>

    <label class="check-option feature-option"><input type="checkbox" id="featStroke"> 書き順の機能を使う（書き順の表示・なぞり書き・書き順プリント。外部のデータを読みこみます）</label>

    <p id="setupNote" class="note"></p>
    <button type="button" id="startBtn" class="primary">スタート</button>
  </section>

  <!-- クイズ画面 -->
  <section id="quiz" hidden>
    <div class="quiz-top">
      <button type="button" id="quitBtn" class="ghost">やめる</button>
      <div id="progressText"></div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div id="qLabel" class="q-label"></div>
    <div id="qCard" class="q-card"></div>
    <div id="choices" class="choice-grid cols-2"></div>
    <div id="feedback" class="feedback" hidden>
      <div id="feedbackMark"></div>
      <div id="feedbackText"></div>
      <button type="button" id="strokeBtn" class="secondary stroke-btn" hidden>✎ かきじゅんを みる</button>
      <div id="strokeBox" class="stroke-box" hidden>
        <div id="strokeWriter" class="stroke-writer"></div>
        <div id="strokeMsg" class="stroke-msg"></div>
      </div>
      <button type="button" id="nextBtn" class="primary">つぎへ</button>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result" hidden>
    <h1>けっか</h1>
    <div id="scoreBig"></div>
    <p id="scoreMsg"></p>
    <div id="missList"></div>
    <button type="button" id="againBtn" class="primary">もういちど</button>
    <button type="button" id="weakBtn" class="secondary">にがて かんじだけ やる</button>
    <button type="button" id="topBtn" class="ghost">さいしょに もどる</button>
  </section>

  <p class="credit stroke-feature">書き順データ：<a href="https://github.com/k1LoW/hanzi-writer-data-jp" target="_blank" rel="noopener">hanzi-writer-data-jp</a>（Arphic Public License / LGPL）、表示：<a href="https://hanziwriter.org/" target="_blank" rel="noopener">Hanzi Writer</a>（MIT）。例語・例文はこのサイトの作成者が作ったものです。 <a href="licenses.html">ライセンス・出どころ</a></p>
</main>

<script src="data-grade1.js"></script>
<script src="data-grade2.js"></script>
<script src="data-grade3.js"></script>
<script src="data-grade4.js"></script>
<script src="data-grade5.js"></script>
<script src="data-grade6.js"></script>
<script src="features.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
